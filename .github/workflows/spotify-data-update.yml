name: Update Spotify Data

# Started at 02:00 SAST on Mondays by Alfred's clock (cf-clock/). GitHub's own
# cron ran hours late, so there's no schedule here.
on:
  workflow_dispatch:     # The clock, or by hand from the Actions tab

# One run at a time, so two runs can't race to push the same file
concurrency:
  group: update-spotify-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-spotify-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # No dependencies to install: the script only uses Node's built-in fetch
      - name: Fetch Spotify data
        id: fetch
        run: node .github/scripts/spotify-data-fetcher.js
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}

      # Alfred commits it, as he does the coffee and watching data. The commit
      # is pushed with GITHUB_TOKEN; the author is his noreply address, which is
      # what puts his name and avatar on it.
      - name: Commit and push if changed
        env:
          # Passed through env, not inlined, because it contains artist and track names
          COMMIT_MSG: ${{ steps.fetch.outputs.message }}
        run: |
          if git diff --quiet data/spotify-data.json; then
            echo "No changes to commit"
            exit 0
          fi
          git config --local user.email "292474565+waynemanor-butler@users.noreply.github.com"
          git config --local user.name "Alfred Pennyworth"
          SUBJECT="${COMMIT_MSG:-🎧 The Spotify records are filed, sir.}"
          # Alfred's ledger adds a body and trailers. If it fails, the subject alone will do.
          if ! node .github/scripts/ledger.js spotify "$SUBJECT" > "$RUNNER_TEMP/commit-msg"; then
            echo "::warning::The ledger could not be written; committing the subject alone"
            git checkout -- data/ledger/spotify.json 2>/dev/null || true
            printf '%s\n' "$SUBJECT" > "$RUNNER_TEMP/commit-msg"
          fi
          cat "$RUNNER_TEMP/commit-msg"
          git add data/spotify-data.json
          # Absent only if the ledger failed before its first entry
          if [ -f data/ledger/spotify.json ]; then git add data/ledger/spotify.json; fi
          git commit -F "$RUNNER_TEMP/commit-msg"
          git pull --rebase --autostash origin main
          git push
