<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- PC Health at 16px, drawn separately so it stays crisp -->
  <rect x="1" y="1" width="14" height="11" fill="#000"/>
  <rect x="2" y="2" width="12" height="9" fill="#d8d0b0"/>
  <rect x="3" y="3" width="10" height="6" fill="#008080"/>
  <g fill="#fff">
    <rect x="5" y="4" width="1" height="1"/><rect x="10" y="4" width="1" height="1"/>
    <rect x="5" y="6" width="1" height="1"/><rect x="10" y="6" width="1" height="1"/>
    <rect x="6" y="7" width="4" height="1"/>
  </g>
  <rect x="12" y="10" width="1" height="1" fill="#00d000"/>
  <rect x="6" y="12" width="4" height="1" fill="#000"/>
  <rect x="3" y="13" width="10" height="3" fill="#000"/>
  <rect x="4" y="13" width="8" height="2" fill="#d8d0b0"/>
</svg>
